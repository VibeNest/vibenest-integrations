version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      root-tooling:
        patterns: ["*"]
  - package-ecosystem: npm
    directories:
      - /auth/nextjs
      - /auth/express
      - /payments/nextjs
      - /payments/express
      - /auth-and-payments/nextjs
      - /auth-and-payments/express
    schedule:
      interval: weekly
    groups:
      runtime-per-example:
        patterns: ["*"]
  - package-ecosystem: nuget
    directories:
      - /auth/aspnet-core
      - /payments/aspnet-core
      - /auth-and-payments/aspnet-core
    schedule:
      interval: weekly
    groups:
      dotnet-per-example:
        patterns: ["*"]
  - package-ecosystem: pip
    directories:
      - /auth/fastapi
      - /payments/fastapi
      - /auth-and-payments/fastapi
    schedule:
      interval: weekly
    groups:
      python-per-example:
        patterns: ["*"]
  - package-ecosystem: composer
    directories:
      - /auth/laravel
      - /payments/laravel
      - /auth-and-payments/laravel
    schedule:
      interval: weekly
    groups:
      php-per-example:
        patterns: ["*"]
  - package-ecosystem: bundler
    directories:
      - /auth/rails
      - /payments/rails
      - /auth-and-payments/rails
    schedule:
      interval: weekly
    groups:
      ruby-per-example:
        patterns: ["*"]
