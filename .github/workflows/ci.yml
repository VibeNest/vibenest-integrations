name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  repository:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm test
      - run: npm audit --audit-level=high

  node-examples:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        example:
          - auth/nextjs
          - auth/express
          - payments/nextjs
          - payments/express
          - auth-and-payments/nextjs
          - auth-and-payments/express
    defaults:
      run:
        working-directory: ${{ matrix.example }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.example }}/package-lock.json
      - run: npm ci
      - run: npm run format:check --if-present
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=high

  dotnet-examples:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        example:
          - auth/aspnet-core
          - payments/aspnet-core
          - auth-and-payments/aspnet-core
    defaults:
      run:
        working-directory: ${{ matrix.example }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Restore locked projects
        shell: bash
        run: |
          dotnet restore --locked-mode
          if [ -f tests/FixtureTests.csproj ]; then dotnet restore tests/FixtureTests.csproj --locked-mode; fi
          if [ -f tests/VibeNestAuth.ReferenceApp.Tests.csproj ]; then dotnet restore tests/VibeNestAuth.ReferenceApp.Tests.csproj --locked-mode; fi
          if [ -f auth-tests/AuthFlowTests.csproj ]; then dotnet restore auth-tests/AuthFlowTests.csproj --locked-mode; fi
      - run: dotnet format --verify-no-changes --no-restore
      - run: dotnet build -c Release --no-restore
      - name: Run example tests
        shell: bash
        run: |
          if [ -f tests/FixtureTests.csproj ]; then dotnet run --project tests/FixtureTests.csproj -c Release --no-restore; fi
          if [ -f tests/VibeNestAuth.ReferenceApp.Tests.csproj ]; then dotnet test tests/VibeNestAuth.ReferenceApp.Tests.csproj -c Release --no-restore; fi
          if [ -f auth-tests/AuthFlowTests.csproj ]; then dotnet test auth-tests/AuthFlowTests.csproj -c Release --no-restore; fi
      - run: dotnet list package --vulnerable --include-transitive

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
